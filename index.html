<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học tập & Đố vui Giáo dục Địa phương tỉnh Thừa Thiên Huế</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hue: '#800000',
                        gold: '#f59e0b',
                    }
                }
            }
        }
    </script>
    
    <!-- Thư viện Pháo hoa Canvas-Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-amber-50 text-gray-900 font-sans min-h-screen flex flex-col justify-between">

    <!-- HEADER TRANG WEB -->
    <header class="bg-hue text-white shadow-xl p-6 text-center border-b-4 border-gold relative">
        <h1 class="text-2xl md:text-4xl font-extrabold text-gold uppercase tracking-wide">
            Giáo dục Địa phương tỉnh Thừa Thiên Huế
        </h1>
        <p class="mt-2 text-amber-200 text-sm md:text-base font-medium">
            Hệ thống Trò chơi Đố vui & Tri thức Thiết thực (Khối 10 - 11 - 12)
        </p>
        
        <!-- NÚT BẬT/TẮT NHẠC NỀN -->
        <button onclick="toggleAudio()" id="music-btn" class="absolute top-4 right-4 bg-gold text-hue font-bold px-3 py-1.5 rounded-full text-xs md:text-sm shadow-md hover:bg-yellow-400 transition">
            🔊 Nhạc nền: Tắt
        </button>
    </header>

    <!-- NỘI DUNG CHÍNH (MAIN QUIZ CONTAINER) -->
    <main class="max-w-3xl mx-auto my-8 p-4 w-full">
        
        <!-- THANH CHỌN KHỐI LỚP (FILTER) -->
        <div class="flex justify-center gap-2 mb-6 flex-wrap">
            <button onclick="filterGrade('all')" class="grade-btn bg-hue text-gold font-bold px-4 py-2 rounded-lg shadow hover:opacity-90">Tất cả Khối</button>
            <button onclick="filterGrade('10')" class="grade-btn bg-amber-200 text-amber-900 font-bold px-4 py-2 rounded-lg shadow hover:bg-gold">Khối 10</button>
            <button onclick="filterGrade('11')" class="grade-btn bg-amber-200 text-amber-900 font-bold px-4 py-2 rounded-lg shadow hover:bg-gold">Khối 11</button>
            <button onclick="filterGrade('12')" class="grade-btn bg-amber-200 text-amber-900 font-bold px-4 py-2 rounded-lg shadow hover:bg-gold">Khối 12</button>
        </div>

        <!-- KHUNG THỬ THÁCH ĐỐ VUI -->
        <div id="quiz-container" class="bg-white rounded-2xl shadow-2xl border border-amber-200 p-6 md:p-8">
            
            <!-- THANH THÔNG TIN THỜI GIAN - ĐIỂM SỐ - KHỐI -->
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <div>
                    <span id="grade-badge" class="bg-hue text-gold font-bold px-3 py-1 rounded-full text-xs md:text-sm mr-2">Khối 10</span>
                    <span id="category-badge" class="bg-amber-100 text-amber-900 font-bold px-3 py-1 rounded-full text-xs md:text-sm">Chủ đề</span>
                </div>
                
                <!-- ĐỒNG HỒ ĐẾM NGƯỢC 20S -->
                <div class="text-hue font-extrabold text-sm md:text-base flex items-center gap-1">
                    ⏱️ <span id="timer" class="text-xl">20</span>s
                </div>
                
                <!-- THẺ ĐIỂM SỐ -->
                <span id="score" class="text-lg font-extrabold text-hue">Điểm: 0</span>
            </div>

            <!-- NỘI DUNG CÂU HỎI -->
            <h2 id="question" class="text-lg md:text-xl font-bold text-gray-800 mb-4 leading-relaxed">
                Nội dung câu hỏi đang tải...
            </h2>

            <!-- KHUNG HÌNH ẢNH MINH HỌA -->
            <div id="image-container" class="mb-4 hidden text-center">
                <img id="question-image" src="" alt="Hình minh họa" class="max-h-64 mx-auto rounded-lg shadow border border-amber-200 object-cover">
                <p id="image-caption" class="text-xs text-gray-500 italic mt-1"></p>
            </div>

            <!-- CÁC PHƯƠNG ÁN LỰA CHỌN (A, B, C, D) -->
            <div id="options" class="space-y-3">
                <!-- Nút đáp án sẽ được load bằng JavaScript -->
            </div>

            <!-- Ô GIẢI THÍCH BÀI HỌC VÀ NÚT TIẾP THEO -->
            <div id="explanation-box" class="mt-6 p-4 bg-amber-50 rounded-xl border border-amber-200 hidden">
                <p class="font-bold text-hue text-sm mb-1">📘 Thông tin tri thức bài học:</p>
                <p id="explanation-text" class="text-sm text-gray-700 leading-relaxed"></p>
            </div>

            <button id="next-btn" onclick="nextQuestion()" class="w-full mt-6 bg-hue text-gold font-extrabold py-3.5 rounded-xl shadow-lg hover:bg-red-900 transition transform hover:scale-[1.01] hidden">
                Câu hỏi tiếp theo ➔
            </button>

        </div>
    </main>

    <!-- FOOTER TRANG WEB -->
    <footer class="bg-hue text-amber-200 text-center py-4 text-xs border-t-2 border-gold">
        <p>© 2026 Dự án Khoa học Kỹ thuật Website Giáo dục Địa phương Thừa Thiên Huế — Tổ 1 Lớp 11B2</p>
    </footer>

    <!-- ================================================================= -->
    <!-- MÃ LẬP TRÌNH BỘ NÃO XỬ LÝ GAME (NẰM TRƯỚC THẺ ĐÓNG </body>)        -->
    <!-- ================================================================= -->
    <script>
        // 1. NGÂN HÀNG CÂU HỎI GDĐP THỪA THIÊN HUẾ (KHỐI 10, 11, 12)
        const allQuestions = [
            // --- KHỐI 10 ---
            {
                grade: "10",
                category: "Danh thắng & Địa lý Huế",
                question: "Hai thực thể địa lý tự nhiên nào được mệnh danh là biểu tượng biểu trưng của Cố đô Huế?",
                image: "[suspicious link removed]",
                caption: "Hình ảnh: Sông Hương và Núi Ngự Bình",
                options: ["Sông Hương & Núi Ngự Bình", "Sông Bồ & Núi Bạch Mã", "Sông Truồi & Hòn Vượn", "Sông Hương & Đèo Hải Vân"],
                answer: 0,
                explanation: "Sông Hương dài khoảng 80km chảy qua lòng thành phố kết hợp núi Ngự Bình tạo nên cảnh quan sơn thủy hữu tình đặc trưng của Huế."
            },
            {
                grade: "10",
                category: "Văn học Dân gian Huế",
                question: "Thể loại văn học dân gian nào phát triển mạnh mẽ ở Huế với tiếng cười hóm hỉnh, sâu sắc?",
                image: "",
                caption: "",
                options: ["Thần thoại", "Giai thoại & Truyện cười dân gian Huế", "Sử thi truyền miệng", "Ca dao miền Bắc"],
                answer: 1,
                explanation: "Truyện cười và giai thoại dân gian Huế phản ánh trí tuệ hóm hỉnh, sự trào lăm và tâm hồn tinh tế của người dân xứ Huế."
            },
            {
                grade: "10",
                category: "Lịch sử & Di sản Huế",
                question: "Quần thể Di tích Cố đô Huế được UNESCO công nhận là Di sản Văn hóa Thế giới vào năm nào?",
                image: "",
                caption: "",
                options: ["Năm 1990", "Năm 1993", "Năm 1999", "Năm 2003"],
                answer: 1,
                explanation: "Tháng 12 năm 1993, Quần thể Di tích Cố đô Huế trở thành Di sản Văn hóa Thế giới đầu tiên của Việt Nam được UNESCO vinh danh."
            },

            // --- KHỐI 11 ---
            {
                grade: "11",
                category: "Âm nhạc & Di sản Phi vật thể",
                question: "Loại hình nghệ thuật diễn xướng âm nhạc nào ở Huế được UNESCO công nhận là Kiệt tác di sản phi vật thể nhân loại năm 2003?",
                image: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80",
                caption: "Hình ảnh: Biểu diễn Nhã nhạc Cung đình Huế",
                options: ["Hát Xoan", "Nhã nhạc Cung đình Huế", "Đàn Ca Tài Tử", "Hát Quan Họ"],
                answer: 1,
                explanation: "Nhã nhạc Cung đình Huế là âm nhạc chính thống dùng trong các lễ tiết cung đình triều Nguyễn, thể hiện sự tao nhã và uy nghiêm."
            },
            {
                grade: "11",
                category: "Nghệ thuật Trang trí triều Nguyễn",
                question: "Kỹ thuật trang trí kiến trúc đặc sắc nào xuất hiện phổ biến trên các công trình lăng tẩm và cung điện Huế?",
                image: "",
                caption: "",
                options: ["Khảm cừu & Khảm sành sứ", "Chạm khắc gỗ Bắc Bộ", "Đúc đồng Tây Nguyên", "Vẽ tranh dầu"],
                answer: 0,
                explanation: "Nghệ thuật khảm sành sứ (mảnh vỡ chén bát, vỏ sò cừu) tạo nên các hoa văn sống động, bền bỉ trên công trình kiến trúc Huế."
            },
            {
                grade: "11",
                category: "Làng nghề Truyền thống",
                question: "Làng nghề truyền thống nào ở Thừa Thiên Huế nổi tiếng với sản phẩm 'Hoa giấy' dùng trong lễ tiết tâm linh?",
                image: "",
                caption: "",
                options: ["Làng gốm Phước Tích", "Làng hoa giấy Thanh Tiên", "Làng đúc đồng Phường Đúc", "Làng nón Lá Tây Hồ"],
                answer: 1,
                explanation: "Hoa giấy Thanh Tiên (xã Phú Mẫu) có lịch sử hơn 300 năm, tiêu biểu cho sự khéo léo và nghệ thuật hoa thủ công truyền thống."
            },

            // --- KHỐI 12 ---
            {
                grade: "12",
                category: "Đô thị Di sản & Phát triển",
                question: "Nghị quyết 54-NQ/TW của Bộ Chính trị đặt mục tiêu xây dựng Thừa Thiên Huế trở thành thành phố trực thuộc Trung ương dựa trên nền tảng nào?",
                image: "",
                caption: "",
                options: ["Đô thị công nghiệp nặng", "Đô thị di sản, văn hóa, sinh thái và cảnh quan", "Trung tâm thương mại tự do", "Đô thị cảng biển"],
                answer: 1,
                explanation: "Thừa Thiên Huế hướng tới phát triển đô thị di sản đặc thù, bảo tồn không gian văn hóa lịch sử song song với sinh thái hiện đại."
            },
            {
                grade: "12",
                category: "Ứng dụng Đô thị Thông minh",
                question: "Ứng dụng di động nào do tỉnh Thừa Thiên Huế phát triển đã đạt giải thưởng Đô thị thông minh châu Á?",
                image: "",
                caption: "",
                options: ["Hue-S", "Hue-Connect", "Smart-Hue", "Hue-App"],
                answer: 0,
                explanation: "Hue-S là siêu ứng dụng phản ánh hiện trường, dịch vụ đô thị thông minh và chính quyền số tiện ích của người dân Thừa Thiên Huế."
            }
        ];

        // 2. BIẾN QUẢN LÝ TRẠNG THÁI GAME
        let activeQuestions = [...allQuestions];
        let currentIdx = 0;
        let score = 0;
        let timerInterval;
        let timeLeft = 20;

        // Âm thanh Nhạc nền
        const bgMusic = new Audio('[suspicious link removed]');
        bgMusic.loop = true;
        bgMusic.volume = 0.2;
        let isMuted = true;

        // 3. KHỞI CHẠY KHI TẢI TRANG
        window.onload = function() {
            loadQuestion();
        };

        // 4. LỌC CÂU HỎI THEO KHỐI LỚP
        function filterGrade(grade) {
            if (grade === 'all') {
                activeQuestions = [...allQuestions];
            } else {
                activeQuestions = allQuestions.filter(q => q.grade === grade);
            }
            currentIdx = 0;
            score = 0;
            document.getElementById('score').innerText = `Điểm: ${score}`;
            loadQuestion();
        }

        // 5. TẢI CÂU HỎI LÊN GIAO DIỆN
        function loadQuestion() {
            startTimer(); // Chạy đồng hồ 20s
            
            // Ẩn ô giải thích và nút Next
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            if (activeQuestions.length === 0) return;
            const q = activeQuestions[currentIdx];

            // Cập nhật nhãn và chữ câu hỏi
            document.getElementById('grade-badge').innerText = `Khối ${q.grade}`;
            document.getElementById('category-badge').innerText = q.category;
            document.getElementById('question').innerText = `Câu ${currentIdx + 1}/${activeQuestions.length}: ${q.question}`;

            // Xử lý hình ảnh minh họa
            const imgContainer = document.getElementById('image-container');
            const imgTag = document.getElementById('question-image');
            const imgCaption = document.getElementById('image-caption');

            if (q.image && q.image.trim() !== "") {
                imgTag.src = q.image;
                imgCaption.innerText = q.caption || "";
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.classList.add('hidden');
            }

            // Nạp danh sách 4 phương án
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 border-2 rounded-xl border-gray-200 hover:border-hue hover:bg-amber-50 font-semibold transition text-gray-800 shadow-sm";
                btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
                btn.onclick = () => selectAnswer(idx);
                optionsDiv.appendChild(btn);
            });
        }

        // 6. ĐỒNG HỒ ĐẾM NGƯỢC
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 20;
            document.getElementById('timer').innerText = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoTimeOut();
                }
            }, 1000);
        }

        // 7. XỬ LÝ HẾT GIỜ TỰ ĐỘNG
        function autoTimeOut() {
            const q = activeQuestions[currentIdx];
            const buttons = document.getElementById('options').children;
            for (let b of buttons) { b.disabled = true; }
            buttons[q.answer].className = "w-full text-left p-4 border-2 rounded-xl bg-green-100 border-green-600 font-bold text-green-900 shadow-sm";

            document.getElementById('explanation-text').innerText = "⏰ Hết 20 giây! " + q.explanation;
            document.getElementById('explanation-box').classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        // 8. XỬ LÝ KHI NGƯỜI CHƠI CHỌN ĐÁP ÁN
        function selectAnswer(selectedIdx) {
            clearInterval(timerInterval); // Dừng đồng hồ
            const q = activeQuestions[currentIdx];
            const buttons = document.getElementById('options').children;

            for (let b of buttons) { b.disabled = true; }

            if (selectedIdx === q.answer) {
                buttons[selectedIdx].className = "w-full text-left p-4 border-2 rounded-xl bg-green-100 border-green-600 font-bold text-green-900 shadow-sm";
                score += 10;
                document.getElementById('score').innerText = `Điểm: ${score}`;
            } else {
                buttons[selectedIdx].className = "w-full text-left p-4 border-2 rounded-xl bg-red-100 border-red-600 font-bold text-red-900 shadow-sm";
                buttons[q.answer].className = "w-full text-left p-4 border-2 rounded-xl bg-green-100 border-green-600 font-bold text-green-900 shadow-sm";
            }

            document.getElementById('explanation-text').innerText = q.explanation;
            document.getElementById('explanation-box').classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        // 9. CHUYỂN CÂU HỎI VÀ TÍNH DANH HIỆU + PHÁO HOA
        function nextQuestion() {
            currentIdx++;
            if (currentIdx < activeQuestions.length) {
                loadQuestion();
            } else {
                clearInterval(timerInterval);

                // BẮN PHÁO HOA CONFETTI
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
                }

                // XÉT DANH HIỆU CỐ ĐÔ
                const maxScore = activeQuestions.length * 10;
                const percentage = (score / maxScore) * 100;
                let badgeTitle = "";
                let badgeIcon = "";

                if (percentage === 100) {
                    badgeTitle = "👑 Chuyên gia Di sản Cố đô Huế";
                    badgeIcon = "🏆";
                } else if (percentage >= 70) {
                    badgeTitle = "🎖️ Sứ giả Văn hóa Địa phương Huế";
                    badgeIcon = "🌟";
                } else {
                    badgeTitle = "🏅 Người yêu Tri thức Cố đô";
                    badgeIcon = "📚";
                }

                // HIỂN THỊ MÀN HÌNH KẾT THÚC
                document.getElementById('quiz-container').innerHTML = `
                    <div class="text-center py-8 bg-amber-50/60 rounded-xl border-2 border-amber-300 shadow-md">
                        <div class="text-6xl mb-3 leading-none">${badgeIcon}</div>
                        <h2 class="text-2xl md:text-3xl font-extrabold text-hue mb-2">🎉 Hoàn thành Thử thách!</h2>
                        <div class="inline-block bg-hue text-gold font-bold px-5 py-2 rounded-full text-base md:text-lg mb-4 shadow border border-yellow-400">
                            ${badgeTitle}
                        </div>
                        <p class="text-lg md:text-xl mb-6 text-gray-800">
                            Tổng điểm đạt được: <span class="font-extrabold text-red-700 text-2xl">${score}</span> / ${maxScore} điểm
                        </p>
                        <button onclick="location.reload()" class="bg-hue hover:bg-red-900 text-gold font-bold px-8 py-3 rounded-xl text-lg transition duration-200 shadow-lg transform hover:scale-105">
                            Thử thách lại 🔄
                        </button>
                    </div>
                `;
            }
        }

        // 10. ĐIỀU KHIỂN NHẠC NỀN
        function toggleAudio() {
            const btn = document.getElementById('music-btn');
            if (isMuted) {
                bgMusic.play().catch(e => console.log("Cần tương tác người dùng"));
                btn.innerText = "🔊 Nhạc nền: Bật";
                isMuted = false;
            } else {
                bgMusic.pause();
                btn.innerText = "🔇 Nhạc nền: Tắt";
                isMuted = true;
            }
        }
    </script>
</body>
</html>
