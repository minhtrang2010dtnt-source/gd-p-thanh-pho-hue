            <div class="w-full md:w-auto">

                </select>
            </div>
        </div>

        <div id="quiz-container" class="bg-white rounded-3xl shadow-2xl border-2 border-amber-200 p-6 md:p-8 relative overflow-hidden">
            
            <!-- THANH THÔNG TIN VÒNG CHƠI -->

                <div class="text-lg font-extrabold text-hue">
                    Điểm: <span id="score" class="text-2xl text-red-700">0</span>
                </div>
            </div>

            <h2 id="question" class="text-lg md:text-xl font-bold text-gray-800 mb-4 leading-relaxed">
                Đang tải câu hỏi...

            <div id="options" class="space-y-3">

            </div>

            </button>

                    topic: "Quần thể Di tích & Đô thị Di sản",

                        { question: "Quần thể Di tích Cố đô Huế được UNESCO công nhận là Di sản Văn hóa Thế giới năm nào?", image: "https://images.unsplash.com/photo-1584467541268-b040f83be3fd?w=800", caption: "Đại Nội Huế - Quần thể di tích Cố đô", options: ["1990", "1993", "2000", "2005"], answer: 1, explanation: "Năm 1993, Cố đô Huế trở thành Di sản Văn hóa Thế giới đầu tiên của Việt Nam." },
                        { question: "Cổng chính phía nam của Hoàng thành Huế có tên gọi là gì?", image: "", caption: "", options: ["Ngọ Môn", "Hiển Nhơn", "Chương Đức", "Hòa Bình"], answer: 0, explanation: "Ngọ Môn là đài cổng chính uy nghi dành riêng cho Vua đi lại và tổ chức các lễ duyệt binh, Lễ Ban sóc." },
                        { question: "Ngôi chùa cổ kính nổi tiếng nhất tựa lưng bên sông Hương được xây dựng từ năm 1601?", image: "", caption: "", options: ["Chùa Thiên Mụ", "Chùa Từ Đàm", "Chùa Báo Quốc", "Chùa Huyền Không"], answer: 0, explanation: "Chùa Thiên Mụ (Linh Mụ) do Chúa Nguyễn Hoàng xây dựng năm 1601 trên đồi Hà Khê." },
                        { question: "Kiến trúc nhà ở truyền thống nét đặc sắc của văn hóa Cố đô Huế là gì?", image: "", caption: "", options: ["Nhà Rường - Nhà Vườn", "Nhà Sàn", "Nhà Ống hiện đại", "Nhà Biệt thự kiểu Pháp"], answer: 0, explanation: "Nhà Rường Huế được làm bằng gỗ chắc chắn với hệ thống cột kèo không dùng đinh, hòa quyện với vườn cây xanh mát." },
                        { question: "Lăng tẩm nào có kiến trúc kết hợp đông tây kim cổ độc đáo nhất triều Nguyễn?", image: "", caption: "", options: ["Lăng Khải Định", "Lăng Minh Mạng", "Lăng Tự Đức", "Lăng Gia Long"], answer: 0, explanation: "Lăng Khải Định (Ứng Lăng) nổi tiếng với nghệ thuật khảm sành sứ rực rỡ và công trình xi măng Pháp." },
                        { question: "Ứng dụng di động đô thị thông minh hàng đầu của tỉnh Thừa Thiên Huế là gì?", image: "", caption: "", options: ["Hue-S", "Hue-Connect", "Smart-Hue", "Hue-App"], answer: 0, explanation: "Hue-S là siêu ứng dụng dịch vụ đô thị thông minh giúp kết nối chính quyền và người dân Thừa Thiên Huế." },
                        { question: "Mục tiêu định hướng theo Nghị quyết 54-NQ/TW đối với Thừa Thiên Huế là trở thành loại hình đô thị nào?", image: "", caption: "", options: ["Thành phố trực thuộc Trung ương trên nền tảng di sản, văn hóa, sinh thái", "Khu kinh tế công nghiệp nặng", "Trung tâm thương mại tự do", "Đô thị cảng biển công nghiệp"], answer: 0, explanation: "Xây dựng Thừa Thiên Huế trở thành Đô thị Di sản trực thuộc Trung ương mang bản sắc văn hóa sinh thái." },
                        { question: "Chủ đề Festival Huế được tổ chức định kỳ mang tầm quốc tế thuộc lĩnh vực nào?", image: "", caption: "", options: ["Festival Văn hóa - Nghệ thuật", "Festival Thể thao", "Festival Ẩm thực đường phố", "Festival Công nghệ số"], answer: 0, explanation: "Festival Huế là hội tụ giao lưu văn hóa nghệ thuật đương đại và di sản quốc tế." },
                        { question: "Chiếc đỉnh đồng lớn nhất mang tên quốc hiệu Việt Nam trong Cửu Đỉnh ở Đại Nội là gì?", image: "", caption: "", options: ["Cao Đỉnh", "Nhân Đỉnh", "Thuần Đỉnh", "Anh Đỉnh"], answer: 0, explanation: "Cao Đỉnh đặt ở vị trí trung tâm đại diện cho Vua Gia Long và quốc hiệu Việt Nam." },
                        { question: "Cây cầu có kiến trúc độc đáo mang biểu tượng hoa sen bắc qua sông Hương vừa hoàn thành gần đây?", image: "", caption: "", options: ["Cầu Dã Viên", "Cầu Tuần", "Cầu Bến Ngự", "Cầu Tràng Tiền"], answer: 0, explanation: "Cầu Dã Viên mang đậm phong cách kiến trúc Huế mềm mại hài hòa với cảnh quan." }
                    ]
                }
            ]
        };

        // TRẠNG THÁI GAME
        let currentGrade = "10";
        let currentTopicIdx = 0;
        let activeQuestions = [];
        let currentIdx = 0;
        let score = 0;
        let timerInterval;
        let timeLeft = 20;

        // ÂM THANH NHẠC NỀN
        const bgMusic = new Audio('[suspicious link removed]');
        bgMusic.loop = true;
        bgMusic.volume = 0.25;
        let isMuted = true;

        // TẢI BAN ĐẦU
        window.onload = function() {
            selectGrade('10');
        };

        // ĐỔI KHỐI LỚP
        function selectGrade(grade) {
            currentGrade = grade;
            
            // Đổi style button
            ['10', '11', '12'].forEach(g => {
                const btn = document.getElementById(`btn-g${g}`);
                if (g === grade) {
                    btn.className = "grade-btn bg-hue text-gold font-bold px-4 py-2 rounded-xl text-sm shadow hover:opacity-90";
                } else {
                    btn.className = "grade-btn bg-amber-100 text-amber-900 font-bold px-4 py-2 rounded-xl text-sm shadow hover:bg-gold";
                }
            });

            // Nạp danh sách Topic
            const select = document.getElementById('topic-select');
            select.innerHTML = '';
            curriculumData[grade].forEach((t, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = `Chủ đề: ${t.topic}`;
                select.appendChild(opt);
            });

            currentTopicIdx = 0;
            startQuiz();
        }

        // ĐỔI CHỦ ĐỀ
        function changeTopic() {
            currentTopicIdx = parseInt(document.getElementById('topic-select').value);
            startQuiz();
        }

        // BẮT ĐẦU GAME
        function startQuiz() {
            activeQuestions = curriculumData[currentGrade][currentTopicIdx].questions;
            currentIdx = 0;
            score = 0;
            document.getElementById('score').innerText = score;
            loadQuestion();
        }

        // TẢI CÂU HỎI
        function loadQuestion() {
            startTimer();
            
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            const q = activeQuestions[currentIdx];

            document.getElementById('grade-badge').innerText = `Khối ${currentGrade}`;
            document.getElementById('category-badge').innerText = curriculumData[currentGrade][currentTopicIdx].topic;
            document.getElementById('question').innerText = `Câu ${currentIdx + 1}/${activeQuestions.length}: ${q.question}`;

            // Hình ảnh
            const imgContainer = document.getElementById('image-container');
            const imgTag = document.getElementById('question-image');
            const imgCaption = document.getElementById('image-caption');

            if (q.image && q.image.trim() !== "") {
                imgTag.src = q.image;
                imgCaption.innerText = q.caption || "";
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.classList.add('hidden');
            }

            // Phương án
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 border-2 rounded-2xl border-gray-200 hover:border-hue hover:bg-amber-50 font-semibold transition text-gray-800 shadow-sm";
                btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
                btn.onclick = () => selectAnswer(idx);
                optionsDiv.appendChild(btn);
            });
        }

        // ĐỒNG HỒ ĐẾM NGƯỢC 20S
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 20;
            document.getElementById('timer').innerText = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoTimeOut();
                }
            }, 1000);
        }

        function autoTimeOut() {
            const q = activeQuestions[currentIdx];
            const buttons = document.getElementById('options').children;
            for (let b of buttons) { b.disabled = true; }
            buttons[q.answer].className = "w-full text-left p-4 border-2 rounded-2xl bg-green-100 border-green-600 font-bold text-green-900 shadow-sm";

            document.getElementById('explanation-text').innerText = "⏰ Hết 20 giây! " + q.explanation;
            document.getElementById('explanation-box').classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        // CHỌN ĐÁP ÁN
        function selectAnswer(selectedIdx) {
            clearInterval(timerInterval);
            const q = activeQuestions[currentIdx];
            const buttons = document.getElementById('options').children;

            for (let b of buttons) { b.disabled = true; }

            if (selectedIdx === q.answer) {
                buttons[selectedIdx].className = "w-full text-left p-4 border-2 rounded-2xl bg-green-100 border-green-600 font-bold text-green-900 shadow-sm";
                score += 10;
                document.getElementById('score').innerText = score;
            } else {
                buttons[selectedIdx].className = "w-full text-left p-4 border-2 rounded-2xl bg-red-100 border-red-600 font-bold text-red-900 shadow-sm";
                buttons[q.answer].className = "w-full text-left p-4 border-2 rounded-2xl bg-green-100 border-green-600 font-bold text-green-900 shadow-sm";
            }

            document.getElementById('explanation-text').innerText = q.explanation;
            document.getElementById('explanation-box').classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        // CHUYỂN CÂU HỎI & KẾT THÚC VÒNG CHƠI
        function nextQuestion() {
            currentIdx++;
            if (currentIdx < activeQuestions.length) {
                loadQuestion();
            } else {
                clearInterval(timerInterval);

                if (typeof confetti === 'function') {
                    confetti({ particleCount: 160, spread: 100, origin: { y: 0.6 } });
                }

                const maxScore = activeQuestions.length * 10;
                const percentage = (score / maxScore) * 100;
                let badgeTitle = "";
                let badgeIcon = "";

                if (percentage === 100) {
                    badgeTitle = "👑 Chuyên gia Di sản Cố đô Huế";
                    badgeIcon = "🏆";
                } else if (percentage >= 70) {
                    badgeTitle = "🎖️ Sứ giả Văn hóa Địa phương Huế";
                    badgeIcon = "🌟";
                } else {
                    badgeTitle = "🏅 Người yêu Tri thức Cố đô";
                    badgeIcon = "📚";
                }

                document.getElementById('quiz-container').innerHTML = `
                    <div class="text-center py-8 bg-amber-50/60 rounded-2xl border-2 border-amber-300 shadow-lg">
                        <div class="text-6xl mb-3 leading-none">${badgeIcon}</div>
                        <h2 class="text-2xl md:text-3xl font-extrabold text-hue mb-2">🎉 Hoàn thành Thử thách Bài học!</h2>
                        <div class="inline-block bg-hue text-gold font-bold px-5 py-2 rounded-full text-base md:text-lg mb-4 shadow border border-yellow-400">
                            ${badgeTitle}
                        </div>
                        <p class="text-lg md:text-xl mb-6 text-gray-800">
                            Tổng điểm đạt được: <span class="font-extrabold text-red-700 text-2xl">${score}</span> / ${maxScore} điểm
                        </p>
                        <button onclick="startQuiz()" class="bg-hue hover:bg-red-900 text-gold font-bold px-8 py-3 rounded-2xl text-lg transition duration-200 shadow-xl transform hover:scale-105">
                            Thử thách lại Chủ đề này 🔄
                        </button>
                    </div>
                `;
            }
        }

        // BẬT TẮT ÂM THANH
        function toggleAudio() {
            const text = document.getElementById('music-text');
            if (isMuted) {
                bgMusic.play().catch(e => console.log("Cần click người dùng để phát audio"));
                text.innerText = "Nhạc nền: Bật";
                isMuted = false;
            } else {
                bgMusic.pause();
                text.innerText = "Nhạc nền: Tắt";
                isMuted = true;
            }
        }
    </script>
</body>
</html>
